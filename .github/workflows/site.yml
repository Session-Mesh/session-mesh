# Publishes the static showcase site (site/) to GitHub Pages at https://session-mesh.com/.
# A push to main that touches site/ (or this workflow, or the staging script) builds and deploys it;
# a manual run does the same. The build job has a read-only token and stages the publishable files
# (not site/tools, not site/README.md) with a CNAME file for the custom domain; only the deploy job
# gets `pages: write` and `id-token: write`, and it runs in the `github-pages` environment. No
# secret is used anywhere. Every third-party action is pinned by full commit SHA (tag in the
# trailing comment). tests/public-ci-workflow.test.ts and tests/site-workflow.test.ts enforce these
# rules.
name: site

on:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/site.yml
      - .github/scripts/site-stage.sh
  workflow_dispatch:

permissions:
  contents: read

# Two deployments never overlap; a running deployment is never cancelled.
concurrency:
  group: site-deploy
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: "24"
  SITE_URL: https://session-mesh.com/
  # A string of the home page that the deployed copy must contain.
  SITE_MARKER: Multi-agent collaboration

jobs:
  build:
    name: build the site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # The page's own checks (static HTML in sync, links, quotations, gates): nothing broken ships.
      - name: Check the site
        run: |
          node site/tools/sync-status.mjs --check
          node site/tools/changelog-to-history.mjs --check
          node site/tools/check-page.mjs
      - name: Stage the publishable files (not site/tools, not site/README.md)
        run: bash .github/scripts/site-stage.sh "$RUNNER_TEMP/site-stage"
      - name: Write the CNAME file
        run: echo session-mesh.com > "$RUNNER_TEMP/site-stage/CNAME"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site-stage

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      # Diagnostic only: DNS or TLS of the domain may not be active yet, so this never fails the job.
      - name: Fetch the public site
        run: |
          code=$(curl --silent --show-error --location --max-time 30 --proto '=https' --output "$RUNNER_TEMP/home.html" \
            --write-out '%{http_code}' "$SITE_URL" || true)
          if [ "$code" = 200 ] && grep -qF -- "$SITE_MARKER" "$RUNNER_TEMP/home.html"; then
            echo "$SITE_URL answers 200 and carries the marker"
            exit 0
          fi
          echo "::warning title=site::$SITE_URL answered '${code:-none}' or lacks the marker (DNS or TLS not active yet?)"
