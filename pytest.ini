[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Known defects are strict xfails: an unexpected pass fails the run.
xfail_strict = true
# Browser tests (Playwright + Chromium, requirements-browser.txt): skipped when Playwright is absent.
markers =
    ptyhost_t42: test-selected attach/replay/resize subset
    ptyhost_t43: test-selected bounded input subset
    ptyhost_t44e: passive observation and non-effect subset
    ptyhost_t41: test-selected control-plane subset (list/new/kill/environment only)
    browser: drives a real Chromium against the mesh (needs requirements-browser.txt)
    ci_local_only: extended browser interaction matrix; every full browser run includes it (scripts/test-local.sh, the public CI browser jobs)
    ci_browser_smoke: representative browser case retained in CI from a ci_local_only module
# Backstop only: every test that can block bounds itself with asyncio.wait_for.
timeout = 60
# server.py registers /favicon.svg with a bare lambda (production code, out of scope here).
filterwarnings =
    ignore:Bare functions are deprecated:DeprecationWarning
